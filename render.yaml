# ==============================================================================
# Goblin Basket - Render Infrastructure as Code (render.yaml)
# ==============================================================================
# Uses rootDir per service so Dockerfile and context resolve correctly.
# ==============================================================================

envVarGroups:
  - name: goblin-shared-secrets
    envVars:
      - key: MONGO_URI
        value: mongodb+srv://project:peoject123@cluster0.hekgfjt.mongodb.net/goblin_basket?retryWrites=true&w=majority
      - key: RABBITMQ_URL
        value: amqps://dwioqrcw:LjJHIMLR_AR7W1zSSb3GMI0cb6gxD5jc@warthog.lmq.cloudamqp.com/dwioqrcw
      - key: JWT_SEC
        value: 9f4a8b1c7e62d5f084a3c1e92d8f7b5a1c6e3d2f9b8a7c4e5d6f1a2b3c4d5e6f
      - key: INTERNAL_SERVICE_KEY
        value: gb_sec_9d3e8f7a1b4c6e2d5f0a8c1e4b7a9d2f6c8e1a3b5d7f
      - key: PAYMENT_QUEUE
        value: payment_event
      - key: RIDER_QUEUE
        value: rider_queue
      - key: ORDER_READY_QUEUE
        value: order_ready_queue
      - key: DB_NAME
        value: Zomato_Clone

services:

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-auth
    runtime: docker
    plan: free
    rootDir: services/auth
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets

  # ─────────────────────────────────────────────
  # RESTAURANT SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-restaurant
    runtime: docker
    plan: free
    rootDir: services/restaurant
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: UTILS_SERVICE
        fromService:
          type: web
          name: goblin-basket-utils
          property: host
      - key: REALTIME_SERVICE
        fromService:
          type: web
          name: goblin-basket-realtime
          property: host

  # ─────────────────────────────────────────────
  # UTILS SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-utils
    runtime: docker
    plan: free
    rootDir: services/utils
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: FRONTEND_URL
        fromService:
          type: web
          name: goblin-basket-frontend
          property: host
      - key: RESTAURANT_SERVICE
        fromService:
          type: web
          name: goblin-basket-restaurant
          property: host
      - key: CLOUD_NAME
        value: demo_cloud
      - key: CLOUD_API_KEY
        value: demo_key
      - key: CLOUD_SECRET_KEY
        value: demo_secret
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder

  # ─────────────────────────────────────────────
  # REALTIME SERVICE (Socket.io)
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-realtime
    runtime: docker
    plan: free
    rootDir: services/realtime
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets

  # ─────────────────────────────────────────────
  # RIDER SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-rider
    runtime: docker
    plan: free
    rootDir: services/rider
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: UTILS_SERVICE
        fromService:
          type: web
          name: goblin-basket-utils
          property: host
      - key: REALTIME_SERVICE
        fromService:
          type: web
          name: goblin-basket-realtime
          property: host
      - key: RESTAURANT_SERVICE
        fromService:
          type: web
          name: goblin-basket-restaurant
          property: host

  # ─────────────────────────────────────────────
  # ADMIN SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-admin
    runtime: docker
    plan: free
    rootDir: services/admin
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
