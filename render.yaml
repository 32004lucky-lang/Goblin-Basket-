# ==============================================================================
# Goblin Basket - Render Infrastructure as Code (render.yaml)
# ==============================================================================
# Auto-wires shared environment groups, ports, and internal routing.
# ==============================================================================

envVarGroups:
  - name: goblin-shared-secrets
    envVars:
      - key: MONGO_URI
        value: mongodb+srv://32004lucky_db_user:password_here@cluster0.c3ernby.mongodb.net/goblin_basket?retryWrites=true&w=majority
      - key: RABBITMQ_URL
        value: amqps://dwioqrcw:LjJHIMLR_AR7W1zSSb3GMI0cb6gxD5jc@warthog.lmq.cloudamqp.com/dwioqrcw
      - key: JWT_SEC
        value: 9f4a8b1c7e62d5f084a3c1e92d8f7b5a1c6e3d2f9b8a7c4e5d6f1a2b3c4d5e6f
      - key: INTERNAL_SERVICE_KEY
        value: gb_sec_9d3e8f7a1b4c6e2d5f0a8c1e4b7a9d2f6c8e1a3b5d7f
      - key: PAYMENT_QUEUE
        value: payment_event
      - key: RIDER_QUEUE
        value: rider_queue
      - key: ORDER_READY_QUEUE
        value: order_ready_queue
      - key: DB_NAME
        value: Zomato_Clone

services:
  # ─────────────────────────────────────────────
  # FRONTEND (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AUTH_SERVICE
        fromService:
          type: web
          name: goblin-basket-auth
          property: host
      - key: VITE_RESTAURANT_SERVICE
        fromService:
          type: web
          name: goblin-basket-restaurant
          property: host
      - key: VITE_UTILS_SERVICE
        fromService:
          type: web
          name: goblin-basket-utils
          property: host
      - key: VITE_REALTIME_SERVICE
        fromService:
          type: web
          name: goblin-basket-realtime
          property: host
      - key: VITE_RIDER_SERVICE
        fromService:
          type: web
          name: goblin-basket-rider
          property: host
      - key: VITE_ADMIN_SERVICE
        fromService:
          type: web
          name: goblin-basket-admin
          property: host
      - key: VITE_INTERNAL_SERVICE_KEY
        value: gb_sec_9d3e8f7a1b4c6e2d5f0a8c1e4b7a9d2f6c8e1a3b5d7f
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: pk_test_placeholder

  # ─────────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-auth
    runtime: docker
    dockerfilePath: services/auth/Dockerfile
    dockerContext: services/auth
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets

  # ─────────────────────────────────────────────
  # RESTAURANT SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-restaurant
    runtime: docker
    dockerfilePath: services/restaurant/Dockerfile
    dockerContext: services/restaurant
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: UTILS_SERVICE
        fromService:
          type: web
          name: goblin-basket-utils
          property: host
      - key: REALTIME_SERVICE
        fromService:
          type: web
          name: goblin-basket-realtime
          property: host

  # ─────────────────────────────────────────────
  # UTILS SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-utils
    runtime: docker
    dockerfilePath: services/utils/Dockerfile
    dockerContext: services/utils
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: FRONTEND_URL
        fromService:
          type: web
          name: goblin-basket-frontend
          property: host
      - key: RESTAURANT_SERVICE
        fromService:
          type: web
          name: goblin-basket-restaurant
          property: host
      - key: CLOUD_NAME
        value: demo_cloud
      - key: CLOUD_API_KEY
        value: demo_key
      - key: CLOUD_SECRET_KEY
        value: demo_secret
      - key: STRIPE_SECRET_KEY
        value: sk_test_placeholder

  # ─────────────────────────────────────────────
  # REALTIME SERVICE (Socket.io)
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-realtime
    runtime: docker
    dockerfilePath: services/realtime/Dockerfile
    dockerContext: services/realtime
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets

  # ─────────────────────────────────────────────
  # RIDER SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-rider
    runtime: docker
    dockerfilePath: services/rider/Dockerfile
    dockerContext: services/rider
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
      - key: UTILS_SERVICE
        fromService:
          type: web
          name: goblin-basket-utils
          property: host
      - key: REALTIME_SERVICE
        fromService:
          type: web
          name: goblin-basket-realtime
          property: host
      - key: RESTAURANT_SERVICE
        fromService:
          type: web
          name: goblin-basket-restaurant
          property: host

  # ─────────────────────────────────────────────
  # ADMIN SERVICE
  # ─────────────────────────────────────────────
  - type: web
    name: goblin-basket-admin
    runtime: docker
    dockerfilePath: services/admin/Dockerfile
    dockerContext: services/admin
    envVars:
      - key: PORT
        value: 10000
      - fromGroup: goblin-shared-secrets
